services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
  crawler-worker:
    build:
      context: ./test/Crawling
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env.docker
    environment:
      PROXY_BASE: http://crawler-proxy:3001/naver-news
      BACKEND_BASE: http://backend:3000
    depends_on:
      - crawler-proxy
      - backend
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:?DB root password required}
      MYSQL_DATABASE: news_db
      MYSQL_USER: ${DOCKER_DB_USER:?DB user required}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:?DB password required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/schema2.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      retries: 15
      start_period: 30s
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: news_db
      DB_USER: ${DOCKER_DB_USER:?DB user required}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:?DB password required}
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
  frontend:
    build: ./backend/frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
  crawler-proxy:
    build: ./test/Crawling
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "3001:3001"
volumes:
  mysql_data:
  ollama_data:
