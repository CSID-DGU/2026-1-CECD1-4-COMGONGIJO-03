services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
  crawler-worker:
    build:
      context: ./test/Crawling
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env.docker
    environment:
      PROXY_BASE: http://crawler-proxy:3001/naver-news
      BACKEND_BASE: http://backend:3000
      CRAWLER_PROVIDER: ${CRAWLER_PROVIDER:-naver}
    command: ['sh', '-c', 'if [ "$$CRAWLER_PROVIDER" = naver ]; then exec node worker.js; fi; exec sleep infinity']
    depends_on:
      - crawler-proxy
      - backend
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:?DB root password required}
      MYSQL_DATABASE: news_db
      MYSQL_USER: ${DOCKER_DB_USER:?DB user required}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:?DB password required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/schema2.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      retries: 15
      start_period: 30s
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: news_db
      DB_USER: ${DOCKER_DB_USER:?DB user required}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:?DB password required}
      CRAWLER_PROVIDER: ${CRAWLER_PROVIDER:-naver}
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
  frontend:
    build: ./backend/frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
  crawler-proxy:
    build: ./test/Crawling
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "127.0.0.1:${CRAWLER_PROXY_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(response => { if (!response.ok) process.exitCode = 1; }).catch(() => { process.exitCode = 1; })"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  mysql_data:
  ollama_data:
